<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jnot</title>
<meta name="description" content="JNot — web development, done simply. Bring the problem; I'll bring the build." />

<meta property="og:title" content="jnot — Joel Nottle" />
<meta property="og:description" content="Web development, done simply. Bring the problem; I'll bring the build." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://jnot.net" />
<meta property="og:image" content="https://jnot.net/jnot-logo.png" />
<meta name="theme-color" content="#060a09" />

<link rel="icon" type="image/png" href="./jnot-logo.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* ---------- design tokens ---------- */
  :root {
    --ink:        #060a09;  /* near-black, faint green-cool tint */
    --ink-2:      #0b110f;  /* raised surface */
    --teal-deep:  #103f3c;  /* hairlines, frame, dividers */
    --teal:       #1c6b65;  /* primary structural green */
    --teal-bright:#2e9a8f;  /* mid teal — eyebrows, accents */
    --sage:       #7d978f;  /* soft green-grey — secondary text */
    --spark:      #46e3a6;  /* cool emerald — the "not", contact hovers */
    --lime:       #b8f24a;  /* bright lime — the brand spark: caret, "not", signature */
    --mist:       #d6e4df;  /* primary text */
    --muted:      #5f736d;  /* meta text */

    --display: "Space Grotesk", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;

    --maxw: 760px;
    --pad: clamp(1.4rem, 5vw, 3.5rem);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--ink);
    color: var(--mist);
    font-family: var(--display);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* ambient field — cool teal depth with one faint warm whisper */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(28,107,101,0.16), transparent 55%),
      radial-gradient(70% 55% at 88% 8%, rgba(184,242,74,0.05), transparent 60%),
      radial-gradient(80% 60% at 12% 108%, rgba(16,63,60,0.22), transparent 60%);
  }

  main { position: relative; z-index: 1; }
  ::selection { background: var(--spark); color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--spark); outline-offset: 4px; border-radius: 2px; }

  /* ---------- shared structure ---------- */
  .wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }
  .wrap-wide { max-width: 1140px; margin: 0 auto; padding-inline: var(--pad); }
  .eyebrow {
    font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.04em;
    color: var(--teal-bright); margin-bottom: 1.6rem;
  }
  section { padding-block: clamp(4.5rem, 10vh, 8rem); }
  .divider { height: 1px; border: 0; max-width: var(--maxw); margin-inline: auto;
    background: linear-gradient(90deg, transparent, var(--teal-deep) 20%, var(--teal-deep) 80%, transparent); }

  /* ---------- hero ---------- */
  .hero { min-height: 100svh; display: grid; place-items: center; text-align: center; position: relative; padding: var(--pad); }

  /* corner brackets — signature lifted from the logo's frame */
  .frame { position: absolute; inset: clamp(1.1rem, 4vw, 3rem); pointer-events: none; }
  .frame .corner { position: absolute; width: clamp(34px, 7vw, 64px); height: clamp(34px, 7vw, 64px); }
  .frame .corner svg { width: 100%; height: 100%; display: block; }
  .frame .corner path {
    fill: none; stroke: var(--teal); stroke-width: 2.5;
    stroke-dasharray: 200; stroke-dashoffset: 200;
    animation: draw 1.1s cubic-bezier(.6,.05,.2,1) forwards;
  }
  .frame .tl { top: 0; left: 0; }
  .frame .tr { top: 0; right: 0; transform: scaleX(-1); }
  .frame .bl { bottom: 0; left: 0; transform: scaleY(-1); }
  .frame .br { bottom: 0; right: 0; transform: scale(-1,-1); }
  .frame .tr path { animation-delay: .08s; }
  .frame .bl path { animation-delay: .16s; }
  .frame .br path { animation-delay: .24s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .hero-inner { position: relative; display: grid; justify-items: center; gap: clamp(1.6rem, 4vw, 2.3rem); opacity: 0; animation: rise 1s ease .5s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .logo { width: clamp(190px, 45w, 380px); height: auto; filter: brightness(1.9) saturate(1.12) drop-shadow(0 0 46px rgba(46,154,143,0.32)); }

  .lead {
    font-size: clamp(1.4rem, 5vw, 2.3rem); font-weight: 600; line-height: 1.14;
    letter-spacing: -0.02em; max-width: 16ch; color: var(--mist);
  }
  .caret { color: var(--lime); font-weight: 400; margin-left: .06em; animation: blink 1.15s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* signature band — the rotating "jnot is not…" line */
  .signature { padding-block: clamp(2.2rem, 5vh, 3.3rem); text-align: center; }
  .sig-line { font-family: var(--mono); font-size: clamp(0.84rem, 2.4vw, 1rem); color: var(--sage); letter-spacing: 0.02em; }
  .sig-line .sig-not { color: var(--lime); }
  .sig-line .rotate { color: var(--mist); display: inline-block; transition: opacity .45s ease; }

  .subline { font-size: clamp(1rem, 2.6vw, 1.18rem); color: var(--sage); font-weight: 400; max-width: 30ch; }
  .meta { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.02em; }
  .meta b { color: var(--teal-bright); font-weight: 500; }

  .scrollcue {
    position: absolute; bottom: clamp(1.4rem, 5vw, 2.6rem); left: 50%; translate: -50% 0;
    font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
    display: inline-flex; flex-direction: column; align-items: center; gap: .5rem;
    opacity: 0; animation: rise 1s ease 1.1s forwards;
  }
  .scrollcue .line { width: 1px; height: 34px; background: linear-gradient(var(--teal), transparent); }

  /* ---------- prose ---------- */
  .prose p { color: var(--mist); font-size: clamp(1.02rem, 2.4vw, 1.18rem); max-width: 60ch; }
  .prose p + p { margin-top: 1.25rem; }
  .prose .quiet { color: var(--sage); }
  .prose .not { color: var(--lime); }
  .prose a.inline { color: var(--teal-bright); border-bottom: 1px solid var(--teal-deep); transition: color .2s, border-color .2s; }
  .prose a.inline:hover { color: var(--spark); border-color: var(--spark); }

  /* ---------- projects grid ---------- */
  .projects { display: grid; grid-template-columns: 1fr; gap: clamp(1rem, 2.4vw, 1.5rem); margin-top: 2.6rem; }
  @media (min-width: 560px) { .projects { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 920px) { .projects { grid-template-columns: repeat(3, 1fr); } }
  .card { position: relative; display: flex; flex-direction: column; background: var(--ink-2); border: 1px solid var(--teal-deep); border-radius: 5px; overflow: hidden; text-decoration: none; transition: transform .35s cubic-bezier(.5,.05,.2,1), border-color .35s; }
  a.card:hover, a.card:focus-visible { transform: translateY(-4px); border-color: var(--teal); }
  a.card:focus-visible { outline: 2px solid var(--spark); outline-offset: 3px; }
  .thumb { aspect-ratio: 16 / 10; width: 100%; overflow: hidden; border-bottom: 1px solid var(--teal-deep); position: relative; background: linear-gradient(135deg, #0c1614, #0a100f); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; filter: saturate(.9) brightness(.9); transition: filter .35s, transform .8s cubic-bezier(.5,.05,.2,1); }
  a.card:hover .thumb img { filter: saturate(1) brightness(1); transform: scale(1.03); }
  .thumb.ph { display: grid; place-items: center; }
  .thumb.ph span { font-family: var(--mono); font-size: .7rem; color: var(--muted); letter-spacing: .04em; }
  .thumb.ph::before, .thumb.ph::after { content: ""; position: absolute; width: 24px; height: 24px; border: 2px solid var(--teal-deep); }
  .thumb.ph::before { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
  .thumb.ph::after { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }
  .card-body { display: flex; flex-direction: column; gap: .65rem; padding: clamp(1.05rem, 2.5vw, 1.35rem); flex: 1; }
  .tag { font-family: var(--mono); font-size: .67rem; letter-spacing: .05em; color: var(--teal-bright); }
  .tag.indie { color: var(--sage); }
  .card h3 { font-size: 1.12rem; font-weight: 600; letter-spacing: -0.01em; color: var(--mist); line-height: 1.2; }
  a.card:hover h3 { color: var(--lime); }
  .card ul { list-style: none; display: grid; gap: .38rem; }
  .card li { position: relative; padding-left: 1.1rem; font-size: .9rem; color: var(--sage); line-height: 1.45; }
  .card li::before { content: "→"; position: absolute; left: 0; color: var(--teal); }
  .card .visit { margin-top: auto; padding-top: .7rem; font-family: var(--mono); font-size: .73rem; color: var(--teal-bright); }
  a.card:hover .visit { color: var(--lime); }
  .card .visit.soon { color: var(--muted); }

  /* ---------- contact ---------- */
  .contact .prose { margin-bottom: 2.6rem; }
  .links { display: grid; gap: 0; border-top: 1px solid var(--teal-deep); }
  .link {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    padding-block: clamp(1.1rem, 3vw, 1.5rem); border-bottom: 1px solid var(--teal-deep);
    font-family: var(--mono);
    transition: padding-left .35s cubic-bezier(.6,.05,.2,1), color .25s ease;
  }
  .link .label { font-size: clamp(1.05rem, 3vw, 1.35rem); color: var(--mist); position: relative; }
  .link .label::before { content: "["; color: var(--teal); opacity: 0; margin-right: .4ch; transition: opacity .3s; }
  .link .label::after  { content: "]"; color: var(--teal); opacity: 0; margin-left: .4ch; transition: opacity .3s; }
  .link .addr { font-size: 0.78rem; color: var(--muted); text-align: right; }
  .link:hover, .link:focus-visible { padding-left: 1rem; color: var(--spark); }
  .link:hover .label, .link:focus-visible .label { color: var(--spark); }
  .link:hover .label::before, .link:hover .label::after,
  .link:focus-visible .label::before, .link:focus-visible .label::after { opacity: 1; color: var(--spark); }

  /* ---------- footer ---------- */
  footer { padding: var(--pad); padding-bottom: clamp(2rem, 6vw, 3.5rem); }
  .foot { max-width: var(--maxw); margin: 0 auto; display: flex; flex-wrap: wrap; gap: .8rem 1.5rem; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 0.74rem; color: var(--muted); }
  .foot .mark { color: var(--teal-bright); letter-spacing: 0.04em; }
  .foot .dot { color: var(--lime); }

  /* ---------- scroll reveal ---------- */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .8s ease, transform .8s cubic-bezier(.5,.05,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .hero-inner, .scrollcue { opacity: 1 !important; }
    .frame .corner path { stroke-dashoffset: 0 !important; }
    .reveal { opacity: 1 !important; transform: none !important; }
    .caret { animation: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main>

  <!-- ============ HERO (staged launch — full site in index-full.html) ============ -->
  <header class="hero">
    <div class="frame" aria-hidden="true">
      <span class="corner tl"><svg viewBox="0 0 64 64"><path d="M2 30 V2 H30" stroke-linecap="square"/></svg></span>
      <span class="corner tr"><svg viewBox="0 0 64 64"><path d="M2 30 V2 H30" stroke-linecap="square"/></svg></span>
      <span class="corner bl"><svg viewBox="0 0 64 64"><path d="M2 30 V2 H30" stroke-linecap="square"/></svg></span>
      <span class="corner br"><svg viewBox="0 0 64 64"><path d="M2 30 V2 H30" stroke-linecap="square"/></svg></span>
    </div>

    <div class="hero-inner">
      <img class="logo" src="./jnot-logo.png" alt="jnot" />
      <h1 class="lead">What will you ask of me next?<span class="caret" aria-hidden="true">▮</span></h1>
      <p class="subline">LWe don't know the answer yet. That's why we're building it.</p>
      <p><a href="mailto:admin@jnot.net" title="Email Joel Nottle">admin@jnot@net.au</a></p>
      <p class="meta">// <b>jnot</b> · web developer · adelaide ↔ anywhere</p>
    </div>
  </header>

</main>

<script>
  (function () {
    var els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) { els.forEach(function (el) { el.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.18 });
    els.forEach(function (el) { io.observe(el); });
  })();
</script>
</body>
</html>
