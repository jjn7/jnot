name: Deploy to GitHub Pages

# Builds the Astro site and publishes dist/ to jnot.net.
# Requires: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_launch_check:
        description: Publish even if placeholders remain
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # Fails if any screenshot, link or copy is still a placeholder,
      # so an unfinished portfolio never goes live by accident.
      - name: Launch check
        if: ${{ !inputs.skip_launch_check }}
        run: npm run launch-check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
