name: Deploy to GitHub Pages

# Every push to main builds the site and publishes it to jnot.net straight away.
# A type error or failed build stops the deploy; unfinished content doesn't.
# Requires: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch: # redeploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # Lists anything still unfinished in the run summary. Report only: never blocks.
      - name: Launch check (report only)
        run: |
          npm run --silent launch-check | tee launch-check.txt || true
          { echo '### Launch check'; echo '```'; cat launch-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
